name: Build Android Apps (Mobile + TV)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mobile
          - tv
  push:
    branches: ["main", "work"]
    paths:
      - ".github/workflows/android-build.yml"
      - "apps/mobile-android/**"
      - "apps/tv-android/**"
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "apps/mobile-android/**"
      - "apps/tv-android/**"

jobs:
  build-mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'mobile'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate mobile Android project
        run: |
          test -f apps/mobile-android/gradlew
          test -f apps/mobile-android/settings.gradle || test -f apps/mobile-android/settings.gradle.kts

      - name: Build mobile release APK
        working-directory: apps/mobile-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload mobile APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: |
            apps/mobile-android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-tv:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'tv'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate TV Android project
        run: |
          test -f apps/tv-android/gradlew
          test -f apps/tv-android/settings.gradle || test -f apps/tv-android/settings.gradle.kts

      - name: Build TV release APK
        working-directory: apps/tv-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload TV APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-release-apk
          path: |
            apps/tv-android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
