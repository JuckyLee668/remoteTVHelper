name: Build Android Apps (Mobile + TV)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mobile
          - tv
  push:
    branches: ["main", "work"]
    paths:
      - ".github/workflows/android-build.yml"
      - "apps/mobile-android/**"
      - "apps/tv-android/**"
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "apps/mobile-android/**"
      - "apps/tv-android/**"

jobs:
  build-mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'mobile'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect mobile Android project
        id: mobile_detect
        run: |
          if [[ -f apps/mobile-android/gradlew ]] && [[ -f apps/mobile-android/settings.gradle || -f apps/mobile-android/settings.gradle.kts ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Mobile project detected."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/mobile-android not ready (missing gradlew or settings.gradle[.kts]); skipping mobile build."
          fi

      - name: Setup JDK 17
        if: steps.mobile_detect.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        if: steps.mobile_detect.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build mobile release APK
        if: steps.mobile_detect.outputs.exists == 'true'
        working-directory: apps/mobile-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload mobile APK artifacts
        if: steps.mobile_detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: |
            apps/mobile-android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-tv:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'tv'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect TV Android project
        id: tv_detect
        run: |
          if [[ -f apps/tv-android/gradlew ]] && [[ -f apps/tv-android/settings.gradle || -f apps/tv-android/settings.gradle.kts ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "TV project detected."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/tv-android not ready (missing gradlew or settings.gradle[.kts]); skipping TV build."
          fi

      - name: Setup JDK 17
        if: steps.tv_detect.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        if: steps.tv_detect.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build TV release APK
        if: steps.tv_detect.outputs.exists == 'true'
        working-directory: apps/tv-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload TV APK artifacts
        if: steps.tv_detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tv-release-apk
          path: |
            apps/tv-android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
